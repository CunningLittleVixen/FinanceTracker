name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, test, lint and check coverage
        run: |
          chmod +x mvnw
          ./mvnw -B verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PCT=$(awk -F, 'NR>1{m+=$8;c+=$9} END{printf "%.0f", 100*c/(m+c)}' target/site/jacoco/jacoco.csv)
          if [ "$PCT" -ge 80 ]; then COLOR=brightgreen
          elif [ "$PCT" -ge 60 ]; then COLOR=yellowgreen
          elif [ "$PCT" -ge 50 ]; then COLOR=yellow
          else COLOR=red; fi
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTE" badges >/dev/null 2>&1; then
            git clone --depth 1 --branch badges "$REMOTE" badges-dir
          else
            mkdir badges-dir
            git -C badges-dir init -b badges
            git -C badges-dir remote add origin "$REMOTE"
          fi
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$COLOR" > badges-dir/coverage.json
          cd badges-dir
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update coverage badge"
          git push origin badges